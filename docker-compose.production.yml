version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: fixmyroad-db
    restart: always
    environment:
      MONGO_INITDB_DATABASE: fixmyroad
    volumes:
      - mongo_data:/data/db
    networks:
      - fixmyroad-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: fixmyroad-server
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/fixmyroad
      AI_SERVICE_URL: http://ai-service:8000
      CLIENT_URL: http://localhost:80
      ENABLE_API_DOCS: "false"
    ports:
      - "5000:5000"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - fixmyroad-net

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: fixmyroad-ai
    restart: always
    ports:
      - "8000:8000"
    networks:
      - fixmyroad-net

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: fixmyroad-client
    restart: always
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - fixmyroad-net

networks:
  fixmyroad-net:
    driver: bridge

volumes:
  mongo_data:
