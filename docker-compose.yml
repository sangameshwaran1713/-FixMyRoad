version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: fixmyroad-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - fixmyroad-network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: fixmyroad-server
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/fixmyroad
      - CLIENT_URL=http://localhost:5173
      - AI_SERVICE_URL=http://ai-service:8000
    depends_on:
      - mongodb
    networks:
      - fixmyroad-network

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: fixmyroad-ai-service
    ports:
      - "8000:8000"
    networks:
      - fixmyroad-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: fixmyroad-client
    ports:
      - "5173:5173"
    depends_on:
      - server
    networks:
      - fixmyroad-network

volumes:
  mongo-data:

networks:
  fixmyroad-network:
    driver: bridge
